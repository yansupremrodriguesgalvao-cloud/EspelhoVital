<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Redefinir senha — Espelho Vital</title>
    <link rel="stylesheet" href="../css/login.css" />
    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
  <link rel="stylesheet" href="../css/theme.css">
<script src="../js/icons.js"></script>
</head>
  <body class="ev-auth">
    <main class="container">
      <div class="login-card">
        <h1>Redefinir senha</h1>
        <form id="redefinirForm">
          <label for="senha">Nova senha (8 a 72 caracteres)</label
          ><input
            id="senha"
            type="password"
            minlength="8"
            maxlength="72"
            autocomplete="new-password"
            required
          /><label for="confirmacao">Repita a nova senha</label
          ><input
            id="confirmacao"
            type="password"
            minlength="8"
            maxlength="72"
            autocomplete="new-password"
            required
          /><button type="submit" class="btn-login">Salvar nova senha</button>
        </form>
        <p id="mensagem" role="status"></p>
        <a href="login.html">Voltar ao login</a>
      </div>
    </main>
    <script src="../js/redefinir-senha.js"></script>
  </body>
</html>
