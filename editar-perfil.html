<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Editar Perfil</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/sidebar.css">

</head>
<body>

<div class="container">

    <a class="voltar" href="perfil-detalhes.html">⬅ Voltar</a>

    <div class="card">

        <h1>Editar Perfil</h1>

        <form id="perfilForm">

            <input type="text" id="nome" placeholder="Nome">

            <input type="email" id="email" placeholder="Email">

            <input type="text" id="telefone" placeholder="Telefone">

            <input type="date" id="dataNascimento">

            <input type="text" id="cidade" placeholder="Cidade">

            <input type="number" id="peso" placeholder="Peso">

            <input type="number" step="0.01" id="altura" placeholder="Altura">

            <select id="objetivo">
                <option>Emagrecer</option>
                <option>Ganhar Massa</option>
                <option>Manter Peso</option>
            </select>

            <button type="submit">
                Salvar Alterações
            </button>

        </form>

    </div>

</div>

<script src="js/editar.js"></script>
<script src="js/sidebar.js"></script>

</body>
</html>
